# Tunnel request/error/HA-connection metrics from cloudflared's --metrics
# listener (containerPort "metrics", 2000). Alerts: CloudflaredTunnel* in
# apps/base/monitoring/jellyfin-streaming/prometheusrule.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      pod: cloudflared
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
