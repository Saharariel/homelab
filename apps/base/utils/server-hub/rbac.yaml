# Read-only cluster view for the Maintenance page and its health gate: node
# versions, workload rollout state, Flux objects and k3s upgrade plans.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-hub-maintenance-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["upgrade.cattle.io"]
    resources: ["plans"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-hub-maintenance-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-hub-maintenance-read
subjects:
  - kind: ServiceAccount
    name: server-hub
    namespace: utils
