apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Data migrations: server-hub never merges image updates for this workload unattended.
    homelab.dev/upgrade: manual
  name: tracearr
  labels:
    app: tracearr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      securityContext:
        # Group-writable access to the backup volume; the image user (1001) is unchanged.
        fsGroup: 1000
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:3.1.7
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: TZ
              value: "UTC"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tracearr-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://tracearr-redis:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracearr-secret
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracearr-secret
                  key: COOKIE_SECRET
            - name: CORS_ORIGIN
              value: "*"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: backup
              mountPath: /data/backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: tracearr-backup
      restartPolicy: Always
