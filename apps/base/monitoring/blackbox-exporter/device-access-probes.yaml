apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: jellyfin-device-access-desktop-blocked
  labels:
    release: kube-prometheus-stack
spec:
  jobName: jellyfin-device-access
  interval: 30m
  # The modules allow 15s; Prometheus' default 10s scrape timeout would cut
  # the probe short first.
  scrapeTimeout: 20s
  module: jellyfin_tv_blocks_desktop
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      # Security check: desktop Chrome on Windows must get 403 from the tv.* WAF rule.
      static:
        - https://tv.saharserver.com/System/Info/Public
      labels:
        probe_group: device_access
        device: desktop_blocked
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: jellyfin-device-access-watch-access
  labels:
    release: kube-prometheus-stack
spec:
  jobName: jellyfin-device-access
  interval: 30m
  # The modules allow 15s; Prometheus' default 10s scrape timeout would cut
  # the probe short first.
  scrapeTimeout: 20s
  module: watch_requires_access
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      # Security check: watch.* must 302 to the Cloudflare Access login.
      static:
        - https://watch.saharserver.com/
      labels:
        probe_group: device_access
        device: watch_access
