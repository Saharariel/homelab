# Jellyfin device-access probes (see the jellyfin_* / watch_requires_access
# modules in helmrelease.yaml). Each device gets its own Probe so its module
# (User-Agent and expected status) is fixed per target. Alerting lives in
# apps/base/monitoring/jellyfin-streaming/prometheusrule.yaml.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: jellyfin-device-access-xbox
  labels:
    release: kube-prometheus-stack
spec:
  jobName: jellyfin-device-access
  interval: 30m
  # The modules allow 15s; Prometheus' default 10s scrape timeout would cut
  # the probe short first.
  scrapeTimeout: 20s
  module: jellyfin_app_xbox
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      # Jellyfin Xbox app (EdgeHTML WebView UA) must get Jellyfin JSON from tv.*.
      static:
        - https://tv.saharserver.com/System/Info/Public
      labels:
        probe_group: device_access
        device: xbox
---
