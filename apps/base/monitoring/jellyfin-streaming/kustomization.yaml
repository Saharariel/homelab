apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
configMapGenerator:
  # Picked up by the Grafana dashboard sidecar (label grafana_dashboard=1).
  - name: jellyfin-streaming-dashboard
    files:
      - jellyfin-streaming.json=jellyfin-streaming-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        # Grafana/PromQL syntax must reach the ConfigMap verbatim.
        kustomize.toolkit.fluxcd.io/substitute: disabled
