apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      BASE_DOMAIN: example.invalid
      BASE_PATH: /ci/base
      NFS_SERVER: 192.0.2.10
      NFS_ROOT: /ci/nfs
