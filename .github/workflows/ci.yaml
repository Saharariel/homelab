name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Scan pushed commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "${zero}" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; scanning full history."
            gitleaks git . --config .gitleaks.toml --redact=100 --no-banner
          else
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
            gitleaks git . --config .gitleaks.toml \
              --log-opts "${BASE_SHA}..${HEAD_SHA}" --redact=100 --no-banner
          fi

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner

      - name: Manifest and Secret policy
        run: |
          python3 -m pip install --quiet pyyaml
          ./scripts/validate-manifests.py

  gitops:
    name: gitops render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Build every kustomization
        run: ./scripts/build-kustomizations.sh

      - name: Render Flux roots
        run: ./scripts/flux-build.sh build

      - name: Validate rendered manifests
        run: ./scripts/kubeconform.sh build/*.yaml

  helm:
    name: helm render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Render Flux roots
        run: ./scripts/flux-build.sh build

      - name: Render every HelmRelease
        run: |
          python3 -m pip install --quiet pyyaml
          ./scripts/render-helmreleases.py build/*.yaml --out build/helm

      - name: Validate rendered charts
        env:
          KUBECONFORM_SKIP: CustomResourceDefinition
        run: ./scripts/kubeconform.sh build/helm/*.yaml

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint YAML
        run: git ls-files '*.yaml' '*.yml' | xargs yamllint -c .yamllint.yaml --strict

      - name: Lint workflows
        run: actionlint -color

      - name: Lint shell scripts
        run: shellcheck -e SC1091,SC2016 scripts/*.sh .githooks/*

      # renovate: datasource=npm depName=renovate
      - name: Validate renovate config
        run: npx --yes --package renovate@44.30.4 renovate-config-validator --strict

      - name: Check whitespace errors in changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
