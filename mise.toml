[tools]
k9s = "latest"
kubectl = "latest"
helm = "4.2.4"
flux2 = "2.7.5"
kubeconform = "0.7.0"
gitleaks = "8.30.0"
actionlint = "1.7.7"
shellcheck = "0.11.0"
"pipx:yamllint" = "1.38.0"

[env]
KUBERNETES_VERSION = "1.33.4"
CRDS_CATALOG_REF = "52b0261318acc7dd0b66e032759b1f218216b980"

[tasks.scan-staged]
description = "gitleaks: scan staged changes"
run = "gitleaks git \"$MISE_CONFIG_ROOT\" --staged --config \"$MISE_CONFIG_ROOT/.gitleaks.toml\" --redact=100 --no-banner"

[tasks.scan-tree]
description = "gitleaks: scan the working tree"
run = "gitleaks dir \"$MISE_CONFIG_ROOT\" --config \"$MISE_CONFIG_ROOT/.gitleaks.toml\" --redact=100 --no-banner"

[tasks.scan-range]
description = "gitleaks: scan the commit range in RANGE"
run = "gitleaks git \"$MISE_CONFIG_ROOT\" --config \"$MISE_CONFIG_ROOT/.gitleaks.toml\" --log-opts \"$RANGE\" --redact=100 --no-banner"

[tasks.scan-history]
description = "gitleaks: scan all reachable history"
run = "gitleaks git \"$MISE_CONFIG_ROOT\" --config \"$MISE_CONFIG_ROOT/.gitleaks.toml\" --redact=100 --no-banner"
