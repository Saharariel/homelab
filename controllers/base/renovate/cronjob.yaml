apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:45.4.0@sha256:fee4fdbe137e25cfaa5f4a53f6be4869afae9fd6e32dc94c8855554d8f020f89
              args:
                - Saharariel/homelab

              envFrom:
                - secretRef:
                    name: renovate-container-env
                - configMapRef:
                    name: renovate-configmap

          restartPolicy: Never
