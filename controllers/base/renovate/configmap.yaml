apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-configmap
  namespace: renovate
data:
  RENOVATE_AUTODISCOVER: "false"
  RENOVATE_GIT_AUTHOR: "Renovate Bot <bot@renovateapp.com>"
  RENOVATE_PLATFORM: "github"
  RENOVATE_PR_HOURLY_LIMIT: "0"
  RENOVATE_PR_CONCURRENT_LIMIT: "20"
  # Post-upgrade tasks may only run these (see renovate.json).
  RENOVATE_ALLOWED_COMMANDS: '["^scripts/vendor-suc\\.sh v[0-9]+\\.[0-9]+\\.[0-9]+$"]'
