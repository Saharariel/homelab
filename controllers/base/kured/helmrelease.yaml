---
# Reboots a node after unattended-upgrades leaves /var/run/reboot-required, one
# node at a time, only Saturday 05:00-07:00 (after the daily 03:00 auto-merge
# window) and only while no alert is firing. Cordon-only (no drain), matching
# the k3s SUC plans: local PVs cannot move and eviction would discard emptyDir.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
spec:
  interval: 30m
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kubereboot
        namespace: kured
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      period: 10m
      rebootDays: [sa]
      startTime: "05:00"
      endTime: "07:00"
      timeZone: Asia/Jerusalem
      concurrency: 1
      prometheusUrl: http://prometheus-operated.monitoring.svc:9090
      alertFiringOnly: true
      alertFilterRegexp: ^(Watchdog|InfoInhibitor)$
      # No pod carries this label, so kured cordons without evicting anything.
      drainPodSelector: homelab.dev/kured-drain=true
      drainTimeout: 5m
      annotateNodes: true
    metrics:
      create: true
