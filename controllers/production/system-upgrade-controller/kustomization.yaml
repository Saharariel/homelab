apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade
resources:
  - ../../base/system-upgrade-controller/
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: system-upgrade-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
      spec:
        template:
          spec:
            containers:
              - name: system-upgrade-controller
                env:
                  # First 1.33 -> 1.34 hop only; explicit env overrides envFrom.
                  - name: SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE
                    value: alpine/kubectl:1.34.2@sha256:96a7d245a74d461925a56e3024d2f027c2a7a822b3e9e0117ec558db42de9c35
