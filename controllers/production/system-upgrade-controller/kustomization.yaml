apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade
resources:
  - ../../base/system-upgrade-controller/
  - server-plan.yaml
  - worker-plan.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: system-upgrade-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
      spec:
        template:
          spec:
            containers:
              - name: system-upgrade-controller
                env:
                  # First 1.33 -> 1.34 hop only; explicit env overrides envFrom.
                  - name: SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE
                    value: rancher/kubectl:v1.35.6@sha256:4f097593e791b1b5e4a67f74cef838034975384789ac87defa3aff50c1c8061f
