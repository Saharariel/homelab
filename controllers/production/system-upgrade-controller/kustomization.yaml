apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade
resources:
  - ../../base/system-upgrade-controller/
  - server-plan.yaml
  - worker-plan.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: system-upgrade-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
      spec:
        template:
          spec:
            containers:
              - name: system-upgrade-controller
                env:
                  # kubectl must stay within one minor of the API server; explicit env
                  # overrides envFrom.
                  - name: SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE
                    value: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
